name: Cross-platform file transfers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:compatibility
      - run: npm run test:resume
